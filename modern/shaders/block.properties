# ------------------------------------------------------------------------------
# Material ID Legend (stored normalized in colortex1.b = id / 255.0)
#   10 : Water
#   11 : Ice / Packed Ice / Blue Ice / Frosted Ice
#   12 : Translucent Glass / Slime / Honey
#   13 : Nether Portal / End Gateway / End Portal
#   20 : Low Waving Foliage (short grass, ferns, flowers, saplings, mushrooms)
#   21 : Tall Waving Foliage Lower/Upper (tall grass, large fern, double flowers, sugarcane)
