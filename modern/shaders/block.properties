#   30 : Warm Emissive (torch, lantern, glowstone, lava, fire, campfire, jack_o_lantern, shroomlight, magma, candles, ochre froglight, redstone lamp)
#   31 : Cool / Soul Emissive (soul torch, soul lantern, soul fire, soul campfire, sea lantern, beacon, conduit, end rod, pearlescent/verdant froglight, amethyst)
#   32 : Accent / Redstone / Sculk / Nether Emissive (redstone torch, crying obsidian, respawn anchor, sculk sensor/catalyst/shrieker, glow lichen, copper bulb)
#   40 : Metallic / Reflective Solid (iron, gold, diamond, emerald, netherite, copper, amethyst blocks)
#   41 : Snow / High-Albedo Diffuse (snow, snow_block, powder_snow)
# ------------------------------------------------------------------------------

