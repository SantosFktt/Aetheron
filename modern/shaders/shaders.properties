# ==============================================================================
# AETHERON SHADERS — Modern Edition (Minecraft 1.20.x+ / Iris + Sodium)
# Photon x Bliss Inspired Next-Generation Shader Pipeline
# ==============================================================================

# ------------------------------------------------------------------------------
# Pipeline & Feature Directives
# ------------------------------------------------------------------------------
clouds = off
sun = false
moon = false
sky = false
stars = false
vignette = false
underwaterOverlay = false

oldHandLight = false
oldLighting = false
separateAo = true
separateEntityDraws = true
particles.ordering = mixed

shadowTerrain = true
shadowTranslucent = true
shadowEntities = true
shadowPlayer = false
shadowBlockEntities = true
shadow.culling = true
frustum.culling = true
backFace.solid = true
backFace.cutout = false
backFace.cutoutMipped = false
backFace.translucent = false
rain.depth = false
beacon.beam.depth = false

# Disable blending for gbuffers_water so colortex3/1/2 store clean surface data
# while colortex0 retains the lit opaque underwater scene from deferred1.
blend.gbuffers_water = off

# ------------------------------------------------------------------------------
# Custom Biome & Weather Smooth Uniforms (Evaluated on CPU for Zero GPU Cost)
# ------------------------------------------------------------------------------
variable.float.isDesertRaw = if(in(biome_category, CAT_DESERT, CAT_MESA, CAT_SAVANNA), 1.0, 0.0)
variable.float.isColdRaw   = if(in(biome_category, CAT_ICY, CAT_TAIGA, CAT_EXTREME_HILLS), 1.0, 0.0)
variable.float.isHumidRaw  = if(in(biome_category, CAT_SWAMP, CAT_JUNGLE), 1.0, 0.0)
variable.float.isOceanRaw  = if(in(biome_category, CAT_OCEAN, CAT_BEACH, CAT_RIVER), 1.0, 0.0)

uniform.float.biomeDesert = smooth(1, isDesertRaw, 4.0, 4.0)
uniform.float.biomeCold   = smooth(2, isColdRaw,   4.0, 4.0)
uniform.float.biomeHumid  = smooth(3, isHumidRaw,  4.0, 4.0)
uniform.float.biomeOcean  = smooth(4, isOceanRaw,  4.0, 4.0)

uniform.float.smoothRain    = smooth(5, rainStrength, 2.5, 4.0)
uniform.float.smoothThunder = smooth(6, thunderStrength, 2.5, 4.0)
uniform.float.sunElevation  = sin(2.0 * pi * sunAngle)

# ------------------------------------------------------------------------------
# Performance Presets: LOW / MEDIUM / ULTRA
# (Every individual setting can still be customized independently after selecting a preset)
# ------------------------------------------------------------------------------
profile.LOW = \
    SHADOW_QUALITY=1 \
    shadowMapResolution=1024 \
    shadowDistance=128.0 \
    CONTACT_SHADOWS=0 \
    CLOUD_QUALITY=1 \
    VOLUMETRIC_FOG_QUALITY=1 \
    GOD_RAYS=1 \
    WATER_QUALITY=1 \
    REFLECTION_QUALITY=1 \
    AO_QUALITY=1 \
    SSIL_QUALITY=0 \
    BLOOM_QUALITY=1 \
    TAA_ENABLED=0 \
    DOF_ENABLED=0 \
    MOTION_BLUR_ENABLED=0 \
    CAS_SHARPENING=0 \
    WEATHER_PUDDLES=0 \
    WAVING_FOLIAGE=1

profile.MEDIUM = \
    SHADOW_QUALITY=2 \
    shadowMapResolution=2048 \
    shadowDistance=192.0 \
    CONTACT_SHADOWS=1 \
    CLOUD_QUALITY=2 \
    VOLUMETRIC_FOG_QUALITY=2 \
    GOD_RAYS=1 \
    WATER_QUALITY=2 \
    REFLECTION_QUALITY=2 \
    AO_QUALITY=2 \
    SSIL_QUALITY=1 \
    BLOOM_QUALITY=2 \
    TAA_ENABLED=1 \
    DOF_ENABLED=0 \
    MOTION_BLUR_ENABLED=0 \
    CAS_SHARPENING=1 \
    WEATHER_PUDDLES=1 \
    WAVING_FOLIAGE=1

profile.ULTRA = \
    SHADOW_QUALITY=3 \
    shadowMapResolution=4096 \
    shadowDistance=256.0 \
    CONTACT_SHADOWS=1 \
    CLOUD_QUALITY=3 \
    VOLUMETRIC_FOG_QUALITY=3 \
    GOD_RAYS=1 \
    WATER_QUALITY=3 \
    REFLECTION_QUALITY=3 \
    AO_QUALITY=3 \
    SSIL_QUALITY=2 \
    BLOOM_QUALITY=2 \
    TAA_ENABLED=1 \
    DOF_ENABLED=0 \
    MOTION_BLUR_ENABLED=0 \
    CAS_SHARPENING=1 \
    WEATHER_PUDDLES=1 \
    WAVING_FOLIAGE=1

# ------------------------------------------------------------------------------
# Configuration Menu Layout (Organized into Clean Logical Categories)
# ------------------------------------------------------------------------------
screen = <profile> <empty> [LIGHTING] [SHADOWS] [ATMOSPHERE] [CLOUDS] [WATER] [VEGETATION] [POST_PROCESSING] [PERFORMANCE]
screen.columns = 2

screen.LIGHTING = SUN_INTENSITY MOON_INTENSITY AMBIENT_INTENSITY BLOCKLIGHT_INTENSITY BLOCKLIGHT_TEMP EMISSIVE_INTENSITY CAVE_BRIGHTNESS SSIL_QUALITY BIOME_LIGHTING WEATHER_PUDDLES
screen.LIGHTING.columns = 2

screen.SHADOWS = SHADOW_QUALITY shadowMapResolution shadowDistance SHADOW_SOFTNESS CONTACT_SHADOWS COLORED_SHADOWS FOLIAGE_SSS
screen.SHADOWS.columns = 2

screen.ATMOSPHERE = ATMOSPHERE_DENSITY VOLUMETRIC_FOG_QUALITY VOLUMETRIC_FOG_DENSITY HEIGHT_FOG_DENSITY DISTANCE_FOG_DENSITY GOD_RAYS GOD_RAY_STRENGTH STAR_BRIGHTNESS MOON_SIZE
screen.ATMOSPHERE.columns = 2

screen.CLOUDS = CLOUD_QUALITY CLOUD_COVERAGE CLOUD_ALTITUDE CLOUD_THICKNESS CLOUD_SPEED CIRRUS_CLOUDS
screen.CLOUDS.columns = 2

screen.WATER = WATER_QUALITY REFLECTION_QUALITY WATER_WAVE_HEIGHT WATER_CLARITY WATER_CAUSTICS RAIN_RIPPLES UNDERWATER_FOG_DENSITY
screen.WATER.columns = 2

screen.VEGETATION = WAVING_FOLIAGE WIND_STRENGTH WAVING_LEAVES WAVING_GRASS WAVING_CROPS
screen.VEGETATION.columns = 2

screen.POST_PROCESSING = TONEMAP_OPERATOR EXPOSURE AUTO_EXPOSURE BLOOM_QUALITY BLOOM_STRENGTH CONTRAST SATURATION VIBRANCE COLOR_TEMP VIGNETTE_STRENGTH DOF_ENABLED DOF_STRENGTH MOTION_BLUR_ENABLED MOTION_BLUR_STRENGTH CAS_SHARPENING CAS_STRENGTH
screen.POST_PROCESSING.columns = 2

screen.PERFORMANCE = AO_QUALITY AO_STRENGTH TAA_ENABLED ADAPTIVE_RAYMARCHING DITHERING_ENABLED
screen.PERFORMANCE.columns = 2

