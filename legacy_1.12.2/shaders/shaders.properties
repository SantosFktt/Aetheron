# ==============================================================================
# AETHERON SHADERS — Legacy Edition (Minecraft 1.12.2 / OptiFine HD U G5+)
# Photon x Bliss Inspired Next-Generation Shader Pipeline (GLSL 120)
# ==============================================================================

# ------------------------------------------------------------------------------
# OptiFine 1.12.2 Compatible Pipeline Directives
# ------------------------------------------------------------------------------
clouds = off
sun = false
moon = false
vignette = false
underwaterOverlay = false

oldHandLight = false
oldLighting = false
separateAo = true

shadowTerrain = true
shadowTranslucent = true
shadowEntities = true
shadowBlockEntities = true
backFace.solid = true
backFace.cutout = false
backFace.cutoutMipped = false
backFace.translucent = false

# Keep colortex3/1/2 clean for deferred water & translucent shading in composite
blend.gbuffers_water = off

# ------------------------------------------------------------------------------
# OptiFine 1.12.2 Pre-Flattening Biome & Weather Smooth Uniforms
# ------------------------------------------------------------------------------
variable.float.isDesertRaw = if(in(biome, BIOME_DESERT, BIOME_DESERT_HILLS, BIOME_MESA, BIOME_MESA_ROCK, BIOME_MESA_CLEAR_ROCK, BIOME_SAVANNA, BIOME_SAVANNA_ROCK), 1.0, 0.0)
variable.float.isColdRaw   = if(in(biome, BIOME_ICE_PLAINS, BIOME_ICE_MOUNTAINS, BIOME_TAIGA, BIOME_TAIGA_HILLS, BIOME_TAIGA_COLD, BIOME_TAIGA_COLD_HILLS, BIOME_FROZEN_OCEAN, BIOME_FROZEN_RIVER, BIOME_EXTREME_HILLS), 1.0, 0.0)
variable.float.isHumidRaw  = if(in(biome, BIOME_SWAMPLAND, BIOME_JUNGLE, BIOME_JUNGLE_HILLS, BIOME_JUNGLE_EDGE), 1.0, 0.0)
variable.float.isOceanRaw  = if(in(biome, BIOME_OCEAN, BIOME_DEEP_OCEAN, BIOME_BEACH, BIOME_RIVER), 1.0, 0.0)

uniform.float.biomeDesert = smooth(1, isDesertRaw, 4.0, 4.0)
uniform.float.biomeCold   = smooth(2, isColdRaw,   4.0, 4.0)
uniform.float.biomeHumid  = smooth(3, isHumidRaw,  4.0, 4.0)
uniform.float.biomeOcean  = smooth(4, isOceanRaw,  4.0, 4.0)
uniform.float.smoothRain  = smooth(5, rainStrength, 2.5, 4.0)

# ------------------------------------------------------------------------------
# Performance Presets: LOW / MEDIUM / ULTRA
# ------------------------------------------------------------------------------
profile.LOW = \
    SHADOW_QUALITY=1 \
    shadowMapResolution=1024 \
    shadowDistance=128.0 \
    CONTACT_SHADOWS=0 \
    CLOUD_QUALITY=1 \
    VOLUMETRIC_FOG_QUALITY=1 \
    GOD_RAYS=1 \
    WATER_QUALITY=1 \
    REFLECTION_QUALITY=1 \
    AO_QUALITY=1 \
    SSIL_QUALITY=0 \
    BLOOM_QUALITY=1 \
    TAA_ENABLED=0 \
    DOF_ENABLED=0 \
    MOTION_BLUR_ENABLED=0 \
    CAS_SHARPENING=0 \
    WEATHER_PUDDLES=0 \
    WAVING_FOLIAGE=1

profile.MEDIUM = \
    SHADOW_QUALITY=2 \
    shadowMapResolution=2048 \
    shadowDistance=192.0 \
    CONTACT_SHADOWS=1 \
    CLOUD_QUALITY=2 \
    VOLUMETRIC_FOG_QUALITY=2 \
    GOD_RAYS=1 \
    WATER_QUALITY=2 \
    REFLECTION_QUALITY=2 \
    AO_QUALITY=2 \
    SSIL_QUALITY=1 \
    BLOOM_QUALITY=2 \
    TAA_ENABLED=1 \
    DOF_ENABLED=0 \
    MOTION_BLUR_ENABLED=0 \
    CAS_SHARPENING=1 \
    WEATHER_PUDDLES=1 \
    WAVING_FOLIAGE=1

profile.ULTRA = \
    SHADOW_QUALITY=3 \
    shadowMapResolution=4096 \
    shadowDistance=256.0 \
    CONTACT_SHADOWS=1 \
    CLOUD_QUALITY=3 \
    VOLUMETRIC_FOG_QUALITY=3 \
    GOD_RAYS=1 \
    WATER_QUALITY=3 \
    REFLECTION_QUALITY=3 \
    AO_QUALITY=3 \
    SSIL_QUALITY=2 \
    BLOOM_QUALITY=2 \
    TAA_ENABLED=1 \
    DOF_ENABLED=0 \
    MOTION_BLUR_ENABLED=0 \
    CAS_SHARPENING=1 \
    WEATHER_PUDDLES=1 \
    WAVING_FOLIAGE=1

# ------------------------------------------------------------------------------
# Organized Configuration Menu
# ------------------------------------------------------------------------------
screen = <profile> <empty> [LIGHTING] [SHADOWS] [ATMOSPHERE] [CLOUDS] [WATER] [VEGETATION] [POST_PROCESSING] [PERFORMANCE]
screen.columns = 2

screen.LIGHTING = SUN_INTENSITY MOON_INTENSITY AMBIENT_INTENSITY BLOCKLIGHT_INTENSITY BLOCKLIGHT_TEMP EMISSIVE_INTENSITY CAVE_BRIGHTNESS SSIL_QUALITY BIOME_LIGHTING WEATHER_PUDDLES
screen.LIGHTING.columns = 2

screen.SHADOWS = SHADOW_QUALITY shadowMapResolution shadowDistance SHADOW_SOFTNESS CONTACT_SHADOWS COLORED_SHADOWS FOLIAGE_SSS
screen.SHADOWS.columns = 2

screen.ATMOSPHERE = ATMOSPHERE_DENSITY VOLUMETRIC_FOG_QUALITY VOLUMETRIC_FOG_DENSITY HEIGHT_FOG_DENSITY DISTANCE_FOG_DENSITY GOD_RAYS GOD_RAY_STRENGTH STAR_BRIGHTNESS MOON_SIZE
screen.ATMOSPHERE.columns = 2

screen.CLOUDS = CLOUD_QUALITY CLOUD_COVERAGE CLOUD_ALTITUDE CLOUD_THICKNESS CLOUD_SPEED CIRRUS_CLOUDS
